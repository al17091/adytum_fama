name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Run Quality Gates (Go Collector & Datalake)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Build Binaries Check
        run: |
          go build -o /dev/null ./cmd/collector
          go build -o /dev/null ./cmd/exporter
