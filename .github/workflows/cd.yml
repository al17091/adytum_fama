name: CD (Build and Push Container Images)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version override (e.g., 0.1.0 or 0.1.0-preview). Leave empty to auto-resolve from tag / VERSION."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adytum_fama

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Semantic Version & Image Tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"

          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          elif [ -f VERSION ]; then
            RAW_VER=$(tr -d '[:space:]' < VERSION)
          else
            RAW_VER="0.1.0"
          fi

          VER="${RAW_VER#v}"

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${REPO_IMAGE}:${VER}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REPO_IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push AdytumFama Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
